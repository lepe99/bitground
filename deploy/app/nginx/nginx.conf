# nginx 공식 이미지(1.30.5-alpine)의 기본 nginx.conf에서 연결 수만 바꾼 것. 사이트 설정은 conf.d (entrypoint.sh가 생성)
user  nginx;
worker_processes  auto;   # 코어 수 = 2

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# 워커마다 열 수 있는 파일 수 (연결 하나 = 파일 하나, 프록시는 클라이언트·백엔드 2개)
worker_rlimit_nofile 16384;

events {
    # 기본 1024 × 워커 2 = 2,048에서 부하 테스트 750명부터 "worker_connections are not enough"로 연결을 받지 못했다.
    # 프록시 요청은 연결 2개(클라이언트·백엔드)를 쓰고 SSE·WebSocket은 계속 열려 있다.
    # 상한일 뿐 미리 잡는 메모리는 작다 (실제 연결만큼 쓴다: 1,000명 부하에서 약 95MB / 컨테이너 상한 128MB)
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
