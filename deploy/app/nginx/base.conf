# http 블록에 포함되는 공통 설정 + 80번(인증서 발급·HTTPS 리다이렉트) + 모르는 호스트 거절
# (사이트별 HTTPS 설정은 sites/*.conf.template, 인증서가 있는 것만 entrypoint.sh가 켠다)

server_tokens off;

# 접속 로그는 JSON 한 줄 (Alloy가 status를 뽑아 Loki로 보낸다)
log_format json escape=json '{"ts":"$time_iso8601","level":"info","status":$status,'
    '"method":"$request_method","host":"$host","uri":"$request_uri","remote_ip":"$remote_addr",'
    '"duration":$request_time,"size":$body_bytes_sent,"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent"}';
access_log /dev/stdout json;

ssl_protocols TLSv1.2 TLSv1.3;
# 1MB에 세션 약 4,000개. 10MB는 이 규모에 과하고 Nginx 메모리 상한(128MB) 안에서 고정으로 차지한다
ssl_session_cache shared:SSL:4m;
ssl_session_timeout 1d;

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain image/svg+xml;

# WebSocket: Upgrade 요청이면 upgrade, 아니면 Connection 헤더를 비워 백엔드 연결을 재사용(keepalive)한다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 백엔드 연결 재사용: 요청마다 새 TCP 연결을 열지 않는다 (부하 시 Nginx 연결 수·TIME_WAIT 감소)
upstream backend_api {
    server backend:8090;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 검증 (certbot 컨테이너가 같은 볼륨에 파일을 쓴다)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 등록하지 않은 도메인이나 IP로 들어온 HTTPS는 인증서 없이 연결을 끊는다
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
