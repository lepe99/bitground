# CI: PR·푸시마다 백엔드·스케줄러·프론트를 검사하고, dev·main에 올라가면 배포 산출물을 만든다.
#   검사   backend(Gradle 테스트, Testcontainers MySQL·Redis) · scheduler(vet·테스트, Testcontainers MySQL) · frontend(lint·build)
#   산출물 백엔드 arm64 이미지 → GHCR, 스케줄러 Lambda zip · 프론트 dist → Actions 산출물
# AWS에 올리는 일은 배포 워크플로가 맡는다 (이 워크플로에는 AWS 권한이 없다)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

# 같은 브랜치·PR에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bitground-backend

jobs:
  backend:
    name: backend 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # @Tag("eval")(실제 Gemini 호출)은 build.gradle에서 빠진다
      - run: ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  scheduler:
    name: scheduler 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: scheduler/go.mod
          cache-dependency-path: scheduler/go.sum
      - name: 포맷 검사
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt 필요:"; echo "$unformatted"; exit 1; fi
      # eval 태그(실제 Gemini 평가)는 실행하지 않지만 컴파일은 되는지 함께 본다
      - run: go vet ./... && go vet -tags eval ./...
      - run: go test ./... -count=1
      - name: Lambda zip (arm64, provided.al2023)
        run: ./build-lambda.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: scheduler-lambda
          path: scheduler/dist/scheduler-lambda.zip
          retention-days: 30

  frontend:
    name: frontend lint·build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 운영 API 주소는 저장소 변수(Settings → Variables)로 넣는다. 없으면 빌드만 확인
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30

  # 검사를 모두 통과하고 dev·main에 푸시됐을 때만 이미지를 올린다 (PR에서는 올리지 않음)
  backend-image:
    name: backend 이미지 (arm64 → GHCR)
    needs: [backend, scheduler, frontend]
    if: github.event_name == 'push'
    # 운영 서버(t4g, Graviton)와 같은 arm64 러너에서 에뮬레이션 없이 빌드 (공개 저장소 무료)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그: 커밋 해시(배포가 정확히 이 버전을 가리킴) + 브랜치 이름(dev/main 최신)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=bitground-backend
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=max,scope=backend-arm64
