# 운영 배포: main의 CI가 성공하면 그 커밋을 AWS에 올린다
#   1) 앱 서버(SSM Run Command): 저장소를 그 커밋으로 맞추고 deploy/app/deploy.sh 실행 (백엔드 이미지 = 커밋 해시 태그, DB 마이그레이션은 백엔드 기동 때)
#   2) 스케줄러 Lambda 두 개: CI가 만든 zip으로 코드 교체
#   3) 프론트: CI가 만든 dist를 S3에 동기화하고 CloudFront 캐시 무효화
#   3-1) 모니터링 서버(SSM Run Command): 저장소를 그 커밋으로 맞추고 deploy/monitoring/deploy.sh 실행 (경보 규칙·대시보드·수집 설정)
#   4) 배포가 끝나면 그 커밋에 vX.Y.Z 태그와 GitHub Release (본문은 CHANGELOG.md의 그 버전 항목)
# 1)~3-1)은 바뀐 영역만 한다: CI가 마지막 릴리즈 태그(= 지금 운영 중인 커밋)와 비교해 남긴 changes.env를 읽는다.
#   어느 단계라도 실패하면 태그가 생기지 않으므로, 다음 배포가 다시 그 태그부터 비교해 빠진 부분까지 올린다
# AWS 권한은 OIDC로 받는다 (역할 bitground-prod-github-deploy는 main 브랜치에서만 맡을 수 있다)
# 필요한 저장소 변수: AWS_ROLE_ARN, APP_INSTANCE_ID, MONITORING_INSTANCE_ID, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 배포는 겹치지 않게 하나씩, 진행 중인 배포는 취소하지 않는다 (중간에 끊기면 서버·Lambda·프론트 버전이 어긋난다)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # 배포 후 태그·릴리즈 생성
  actions: read   # CI 실행의 산출물(Lambda zip, 프론트 dist) 내려받기
  id-token: write # AWS OIDC

env:
  AWS_REGION: ap-northeast-2
  SHA: ${{ github.event.workflow_run.head_sha }}
  COLLECTOR_FUNCTION: bitground-prod-scheduler-collector
  WRITER_FUNCTION: bitground-prod-scheduler-writer

jobs:
  deploy:
    name: 운영 배포
    # main에 푸시되어 CI가 성공한 경우만 (PR·수동 실행·실패한 CI는 배포하지 않음)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # environment를 지정하면 OIDC sub가 environment:production이 되어 배포 역할(ref:refs/heads/main만 신뢰)을 맡을 수 없다
    steps:
      - name: 배포할 커밋
        run: |
          echo "커밋: $SHA"
          echo "CI 실행: ${{ github.event.workflow_run.html_url }}"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # CI가 판정한 변경 영역. 없으면(예전 CI 실행 등) 전부 배포한다
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: changes
          path: artifacts/changes

      - id: changes
        name: 바뀐 영역
        run: |
          mkdir -p artifacts/changes && f=artifacts/changes/changes.env
          if [ ! -s "$f" ]; then
            echo "변경 영역 정보가 없어 전부 배포합니다"
            printf 'backend=true\nserver=true\nscheduler=true\nfrontend=true\nmonitoring=true\n' > "$f.all"
            f=$f.all
          fi
          cat "$f" | tee -a "$GITHUB_OUTPUT"
          {
            echo '### 배포 단계'
            echo '| 영역 | 배포 |'
            echo '|---|---|'
            sed 's/^\(.*\)=\(.*\)$/| \1 | \2 |/' "$f"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v8
        if: steps.changes.outputs.scheduler == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: scheduler-lambda
          path: artifacts/scheduler

      - uses: actions/download-artifact@v8
        if: steps.changes.outputs.frontend == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: frontend-dist
          path: artifacts/frontend

      # 1) 백엔드 먼저: 새 프론트·스케줄러가 새 API·스키마를 기대할 수 있으므로
      #    백엔드 코드나 서버 설정(deploy/app)이 바뀌었을 때만. 그대로면 서버는 지금 커밋 그대로 둔다
      #    (다음 배포 때 deploy.sh가 서버에 남은 .deployed-sha부터 비교하므로 nginx 등 설정 반영은 빠지지 않는다)
      - name: 앱 서버 배포 (SSM Run Command)
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.server == 'true'
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
        run: |
          params=$(jq -n --arg sha "$SHA" '{commands: [
            "set -euo pipefail",
            "cd /opt/bitground",
            "git fetch -q origin \($sha)",
            "git checkout -q --detach \($sha)",
            "bash deploy/app/deploy.sh \($sha)"
          ], executionTimeout: ["900"]}')
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
                --comment "deploy $SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "명령 ID: $cmd"
          # 이미지 받기·백엔드 기동까지 몇 분 걸릴 수 있어 직접 기다린다 (aws ssm wait는 100초에서 끝남)
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "결과: $status"
          [ "$status" = Success ]

      # 2) 수집(A)·쓰기(B)는 같은 바이너리 (실행 모드는 함수 환경 변수로 나뉜다)
      - name: 스케줄러 Lambda 교체
        if: steps.changes.outputs.scheduler == 'true'
        run: |
          zip=artifacts/scheduler/scheduler-lambda.zip
          for fn in "$COLLECTOR_FUNCTION" "$WRITER_FUNCTION"; do
            aws lambda update-function-code --function-name "$fn" --zip-file "fileb://$zip" \
                --query '[FunctionName,CodeSha256]' --output text
            aws lambda wait function-updated-v2 --function-name "$fn"
          done

      # 3) 해시가 붙은 assets는 오래 캐시하고, index.html은 매번 새로 받게 한다 (예전 index가 지운 파일을 가리키지 않게 index를 마지막에)
      - name: 프론트 배포 (S3 + CloudFront)
        if: steps.changes.outputs.frontend == 'true'
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          dist=artifacts/frontend
          aws s3 sync "$dist/assets" "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync "$dist" "s3://$BUCKET" --exclude "assets/*" --exclude index.html --only-show-errors
          aws s3 cp "$dist/index.html" "s3://$BUCKET/index.html" --cache-control no-cache --only-show-errors
          # 이번 빌드에 없는 예전 파일 정리 (index.html을 올린 뒤에)
          aws s3 sync "$dist" "s3://$BUCKET" --delete --only-show-errors
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' \
               --query Invalidation.Id --output text)
          echo "캐시 무효화: $id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      # 3-1) 사용자 요청이 지나는 경로가 아니라 맨 뒤에 둔다. 실패하면 태그가 생기지 않아 다음 배포가 다시 시도한다 (이미 나간 앱 배포는 그대로 둔다)
      #      인터넷 경로가 없는 서버라 git·aws 명령이 앱 서버 tinyproxy를 거치도록 프록시 설정을 먼저 읽는다
      - name: 모니터링 서버 배포 (SSM Run Command)
        if: steps.changes.outputs.monitoring == 'true'
        env:
          INSTANCE_ID: ${{ vars.MONITORING_INSTANCE_ID }}
        run: |
          : "${INSTANCE_ID:?저장소 변수 MONITORING_INSTANCE_ID가 없습니다 (Settings → Variables)}"
          params=$(jq -n --arg sha "$SHA" '{commands: [
            "set -euo pipefail",
            "if [ -f /etc/profile.d/proxy.sh ]; then . /etc/profile.d/proxy.sh; fi",
            "cd /opt/bitground",
            "git fetch -q origin \($sha)",
            "git checkout -q --detach \($sha)",
            "bash deploy/monitoring/deploy.sh \($sha)"
          ], executionTimeout: ["600"]}')
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
                --comment "deploy monitoring $SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "명령 ID: $cmd"
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "결과: $status"
          [ "$status" = Success ]

      - name: 배포 확인
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://api.bitground.kr/healthz
          echo
          curl -fsS -o /dev/null -w 'www %{http_code}\n' https://www.bitground.kr/

      # 4) 운영에 나간 커밋에만 릴리즈를 남긴다 (배포가 실패하면 여기까지 오지 않음)
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          path: release
          sparse-checkout: |
            .github/scripts
            CHANGELOG.md
            frontend/package.json
            backend/build.gradle
          sparse-checkout-cone-mode: false

      - name: 태그·GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bash .github/scripts/release-version.sh)
          tag="v$version"
          # 같은 버전을 다시 배포한 경우(재실행 등)에는 릴리즈를 새로 만들지 않는다
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag 태그가 이미 있어 릴리즈를 건너뜁니다" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash .github/scripts/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo "릴리즈: $(gh release view "$tag" --json url -q .url)" | tee -a "$GITHUB_STEP_SUMMARY"
