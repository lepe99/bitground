plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // DB 스키마 마이그레이션 (src/main/resources/db/migration)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 통합 테스트: 실제 MySQL·Redis 컨테이너
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    // object storage (AWS S3, 로컬은 S3Mock)
    implementation platform('software.amazon.awssdk:bom:2.29.0')
    implementation 'software.amazon.awssdk:s3'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 게시글·공지 HTML 서버 측 정제
    implementation 'org.jsoup:jsoup:1.18.3'
    // logging
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
    // AI 평가셋(@Tag("eval"))은 실제 Gemini를 부르므로 일반 테스트에서 뺀다 → ./gradlew aiEval
    useJUnitPlatform {
        excludeTags 'eval'
    }
    // Docker Engine 29+는 API 1.40 미만을 거부하므로 Testcontainers(docker-java)가 쓸 API 버전을 명시
    systemProperty 'api.version', '1.44'
    // 운영(docker-entrypoint.sh)과 같은 시간대. 앱은 KST LocalDateTime을 전제로 하므로,
    // UTC인 CI 러너에서 JDBC·JPA가 같은 시각을 서로 다르게 변환해 9시간 어긋나던 문제
    systemProperty 'user.timezone', 'Asia/Seoul'
}

// AI 평가셋 실행: ./gradlew aiEval [-PevalRuns=3] [-PevalDelayMs=4000] [-PpromptVersion=season-review-v2]
// 고정 입력(src/test/resources/eval)을 실제 Gemini로 돌려 build/reports/ai-eval에 보고서를 남긴다 (GEMINI_API_KEY 필요, backend/.env도 읽음)
tasks.register('aiEval', Test) {
    description = 'AI 시즌 리뷰 평가셋을 실제 Gemini로 실행'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'eval'
    }
    outputs.upToDateWhen { false }
    systemProperty 'eval.runs', findProperty('evalRuns') ?: '2'
    // 호출 사이 간격(ms). 요청 한도(429)에 걸리지 않게
    systemProperty 'eval.delayMs', findProperty('evalDelayMs') ?: '4000'
    // 비교할 프롬프트 버전 (resources/prompts/{버전}/). 없으면 운영 기본값
    if (findProperty('promptVersion')) systemProperty 'eval.promptVersion', findProperty('promptVersion')
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
    }
}
