# 비밀값과 환경별 값은 환경변수로 주입한다.
# 로컬에서는 backend/.env 파일을 읽는다 (.env.example 참고, 커밋 금지).
spring:
  application.name: bitground
  config:
    import: optional:file:.env[.properties]

  # mysql 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/bitground?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:bitground}
    password: ${DB_PASSWORD:bitground}
    hikari:
      maximum-pool-size: 24
      minimum-idle: 3
      idle-timeout: 300000   # 5분
      connection-timeout: 30000  # 30초
      max-lifetime: 1200000  # 20분
      leak-detection-threshold: 20000  # 20초
      validation-timeout: 3000  # 커넥션 검증 시간

  # jpa 설정 (스키마는 db/init/01-schema.sql 이 기준)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false # osiv 사용하지 않음
    properties:
      hibernate:
        # 배치 처리 설정
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # SQL 포맷팅
        format_sql: true
        use_sql_comments: true

  # redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 6
          min-idle: 2
          max-wait: 5000ms  # (연결 대기 시간)
        shutdown-timeout: 200ms

  # 비동기 작업 설정
  task:
    execution:
      pool:
        core-size: 5
        max-size: 12
        queue-capacity: 200
        keep-alive: 60s
    scheduling:
      pool:
        size: 3  # 스케줄링 스레드 개수

  # 캐시 설정
  cache:
    type: redis
    redis:
      time-to-live: 600000ms # 10분

  # 트랜잭션 설정
  transaction:
    default-timeout: 30  # 트랜잭션 타임아웃 30초

  # oAuth2 설정 (redirect-uri는 요청 도메인 기준으로 자동 생성)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: openid,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: openid,profile_nickname,profile_image
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2/authorize
            token-uri: https://nid.naver.com/oauth2/token
            jwk-set-uri: https://nid.naver.com/oauth2/jwks
            issuer-uri: https://nid.naver.com
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            issuer-uri: https://kauth.kakao.com

# 서버 포트, 프록시(로드밸런서/CloudFront) 뒤에서 X-Forwarded-* 헤더 신뢰
server:
  port: 8090
  forward-headers-strategy: framework

# swagger doc
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui.html

# jwt 토큰 관련 설정 (secret, 만료시간)
jwt:
  secret: ${JWT_SECRET}
  expired_time: 1800000 # 30분
  issuer: bitground-auth
  audience: bitground-api

# refresh token 만료시간
refresh_expired_time: 86400000 # 1일

# react 서버 주소 (CORS, 로그인 후 리다이렉트)
react.host: ${REACT_HOST:http://localhost:5173}

# object storage 설정
ncp:
  accessKey: ${NCP_ACCESS_KEY:}
  secretKey: ${NCP_SECRET_KEY:}
  regionName: kr-standard
  endPoint: https://kr.object.ncloudstorage.com
  bucket: ${NCP_BUCKET:bitground}

# 네이버 뉴스 검색 API
naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID:}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:}

# prometheus 엔드포인트 설정
management:
  server:
    port: 8091 # Actuator 전용 포트
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

# logging 설정 (파일 대신 표준 출력으로 남긴다)
logging:
  level:
    bit.bitgroundspring: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.sql.results.jdbc.internal.DeferredResultSetAccess: ERROR
  aop:
    max-string-length: 100
    max-collection-size: 3

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL:gemini-2.5-flash}

# dev: 6시간 주기 시즌/스플릿, prod: 월 2회 시즌
scheduler:
  setting: ${SCHEDULER_SETTING:dev}

upbit:
  api:
    ticker-url: https://api.upbit.com/v1/ticker?markets={symbol}
  websocket:
    ticker-url: wss://api.upbit.com/websocket/v1
    connection-timeout: 10000
    reconnect:
      initial-delay: 1000
      max-delay: 60000
  order:
    execution:
      queue: order-execution-queue

# 스케줄러(Go)가 시즌 갱신 알림을 보낼 때 쓰는 공유 키
season:
  update:
    key: ${SEASON_UPDATE_KEY}
