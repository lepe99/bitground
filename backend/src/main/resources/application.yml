# 비밀값과 환경별 값은 환경변수로 주입한다.
# 로컬에서는 backend/.env 파일을 읽는다 (.env.example 참고, 커밋 금지).
spring:
  # BigDecimal 금액·수량을 1E-8 같은 지수 표기 없이 숫자 그대로 응답
  jackson:
    generator:
      write-bigdecimal-as-plain: true

  application.name: bitground
  config:
    import: optional:file:.env[.properties]

  # mysql 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3307/bitground?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:bitground}
    password: ${DB_PASSWORD:bitground}
    hikari:
      # RDS 프리티어(db.t4g.micro)·1GB EC2 기준. 요청 스레드보다 커넥션이 적어도 대부분 짧은 쿼리라 충분
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000   # 5분
      connection-timeout: 30000  # 30초
      max-lifetime: 1200000  # 20분
      leak-detection-threshold: 20000  # 20초
      validation-timeout: 3000  # 커넥션 검증 시간

  # 스키마는 Flyway 마이그레이션(db/migration/V*.sql)이 관리한다. 기동 시 미적용 버전만 순서대로 실행
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Flyway 도입 전부터 테이블이 있던 DB는 V1(초기 스키마)을 적용된 것으로 보고 V2부터 실행
    baseline-on-migrate: true
    baseline-version: 1

  # jpa 설정 (스키마 변경은 Flyway로만, Hibernate는 엔티티와 스키마가 맞는지 기동 시 검증만)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false # osiv 사용하지 않음
    properties:
      hibernate:
        # 배치 처리 설정
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # SQL 포맷팅
        format_sql: true
        use_sql_comments: true

  # redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 6
          min-idle: 2
          max-wait: 5000ms  # (연결 대기 시간)
        shutdown-timeout: 200ms

  # 비동기 작업 설정
  task:
    execution:
      pool:
        core-size: 5
        max-size: 12
        queue-capacity: 200
        keep-alive: 60s
    scheduling:
      pool:
        size: 3  # 스케줄링 스레드 개수

  # 캐시 설정
  cache:
    type: redis
    redis:
      time-to-live: 600000ms # 10분

  # 업로드 크기 제한 (이미지 5MB)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # 트랜잭션 설정
  transaction:
    default-timeout: 30  # 트랜잭션 타임아웃 30초

  # oAuth2 설정 (redirect-uri는 요청 도메인 기준으로 자동 생성)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: openid,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: openid,profile_nickname,profile_image
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2/authorize
            token-uri: https://nid.naver.com/oauth2/token
            jwk-set-uri: https://nid.naver.com/oauth2/jwks
            issuer-uri: https://nid.naver.com
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            # OIDC 표준 userinfo (https://kauth.kakao.com/.well-known/openid-configuration). /v2/user/me는 카카오 고유 형식이라 sub가 없다
            user-info-uri: https://kapi.kakao.com/v1/oidc/userinfo
            user-name-attribute: sub
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
            issuer-uri: https://kauth.kakao.com

# 서버 포트, 프록시(로드밸런서/CloudFront) 뒤에서 X-Forwarded-* 헤더 신뢰
server:
  port: 8090
  forward-headers-strategy: framework

# swagger doc
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/swagger-ui.html

# jwt 토큰 관련 설정 (secret, 만료시간)
jwt:
  secret: ${JWT_SECRET}
  expired_time: 1800000 # 30분
  issuer: bitground-auth
  audience: bitground-api

# refresh token 만료시간
refresh_expired_time: 86400000 # 1일

# react 서버 주소 (로그인 후 리다이렉트)
react.host: ${REACT_HOST:http://localhost:5173}

# 브라우저 요청을 허용할 프론트 주소 (CORS, WebSocket 공통). 쉼표로 여러 개
# 운영 예: https://bitground.kr,https://www.bitground.kr
cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:${react.host}}

# 이미지 업로드용 S3 호환 스토리지
# 운영: endpoint·키를 비우면 EC2 IAM 역할로 AWS S3에 접근
# 로컬: docker-compose의 S3Mock (http://localhost:9090)
storage:
  bucket: ${STORAGE_BUCKET:bitground}
  region: ${STORAGE_REGION:ap-northeast-2}
  endpoint: ${STORAGE_ENDPOINT:}
  public-url: ${STORAGE_PUBLIC_URL:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}

# 네이버 뉴스 검색 API
naver:
  news:
    client-id: ${NAVER_NEWS_CLIENT_ID:}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:}

# Actuator: 서비스 포트(8090)와 분리된 관리 포트에서만 제공
# 운영에서는 관리 포트를 외부에 열지 않는다 (보안그룹에서 8091 차단, 같은 호스트의 수집기만 접근)
management:
  server:
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never # DB·Redis 상태 등 내부 정보는 응답에 넣지 않음
      probes:
        enabled: true     # /actuator/health/liveness, /readiness (컨테이너 헬스체크용)
  prometheus:
    metrics:
      export:
        enabled: true

# logging 설정 (파일 대신 표준 출력으로 남긴다)
# - 모든 로그에 [traceId,userId] 를 붙인다 (TraceIdFilter, JwtAuthenticationFilter가 MDC에 기록)
# - Loki 수집용 JSON 로그: 환경변수 LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash
logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{userId:-}]"
  level:
    bit.bitgroundspring: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.sql.results.jdbc.internal.DeferredResultSetAccess: ERROR
  aop:
    max-string-length: 100
    max-collection-size: 3
    slow-threshold-ms: 500 # 이 시간 이상 걸린 @Loggable 호출은 WARN

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  # AI 시즌 리뷰 프롬프트 버전 (resources/prompts/{버전}/). 새 버전을 만들면 여기만 바꾸고, 문제가 있으면 되돌린다
  season-review:
    prompt-version: ${GEMINI_SEASON_REVIEW_PROMPT:season-review-v2}

# dev: 6시간 주기 시즌/스플릿, prod: 월 2회 시즌
scheduler:
  setting: ${SCHEDULER_SETTING:dev}

upbit:
  api:
    ticker-url: https://api.upbit.com/v1/ticker?markets={symbol}
  websocket:
    ticker-url: wss://api.upbit.com/websocket/v1
    connection-timeout: 10000
    reconnect:
      initial-delay: 1000
      max-delay: 60000
  order:
    execution:
      queue: order-execution-queue

# 스케줄러(Go)가 시즌 갱신 알림을 보낼 때 쓰는 공유 키
season:
  update:
    key: ${SEASON_UPDATE_KEY}
