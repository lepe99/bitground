# 로컬 개발 환경
#   인프라만 (MySQL, Redis, S3Mock):     docker compose up -d
#   + 백엔드 컨테이너:                   docker compose --profile app up -d --build
#   + 모니터링 (로그·지표 수집):          docker compose --profile app --profile monitoring up -d --build
#       Grafana(Loki 로그, Prometheus 지표): http://localhost:3000
# 계속 떠 있어야 하는 서비스는 모두 restart: unless-stopped.
#   (Docker Desktop이 다시 시작되면 일부만 살아나, 의존 대상(MySQL 등) 없이 오류만 반복하던 문제가 있었다)
# 컨테이너 출력 로그(json-file)는 호스트에 따로 쌓이므로 크기를 제한한다.
# 백엔드 로그에는 접속 IP 등이 들어가며, 회전된 옛 파일은 지워져 오래 남지 않는다 (개인정보처리방침 '접속 기록 3개월')
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    logging: *default-logging
    image: mysql:8.0
    container_name: bitground-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bitground
      MYSQL_USER: bitground
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bitground}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "3307:3306" # 호스트에 설치된 MySQL(3306)과 충돌하지 않도록 3307 사용
    volumes:
      - mysql-data:/var/lib/mysql
      # 테이블은 백엔드 기동 시 Flyway가 만든다 (backend/src/main/resources/db/migration)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: bitground-redis
    restart: unless-stopped
    # AOF: 쓰기를 1초마다 디스크에 기록해, 갑자기 죽어도 잃는 데이터를 1초 안쪽으로 줄인다 (체결 스트림·리프레시 토큰 등).
    # 그래도 잃은 예약 주문 대기열은 백엔드가 DB 기준으로 다시 만든다 (OrderBookWatchdog)
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3 호환 로컬 스토리지 (이미지 업로드). 인증 없이 읽기 가능
  s3:
    logging: *default-logging
    image: adobe/s3mock:3.12.0
    container_name: bitground-s3
    restart: unless-stopped
    environment:
      initialBuckets: bitground
      retainFilesOnExit: "true"
      root: /data
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/data

  # ── app 프로필: 백엔드 컨테이너 ─────────────────────────────────────────
  backend:
    logging: *default-logging
    profiles: ["app"]
    build: ./backend
    container_name: bitground-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bitground?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: bitground
      DB_PASSWORD: ${MYSQL_PASSWORD:-bitground}
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://s3:9090
      STORAGE_PUBLIC_URL: http://localhost:9090/bitground # 브라우저에서 이미지를 읽는 주소
      REACT_HOST: http://localhost:5173
      # 기본 JSON(logstash): Alloy → Loki 수집용. 텍스트로 보려면 LOG_FORMAT= (빈 값)
      # (텍스트 로그를 Loki가 JSON으로 읽지 못해 스택 트레이스 줄마다 파싱 오류가 나던 문제)
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT-logstash}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started # 프로필 사진 업로드

  # ── scheduler 프로필: Go 스케줄러를 로컬에서 매시 실행 (운영의 Lambda + EventBridge 대신)
  #   docker compose --profile app --profile scheduler up -d --build scheduler
  #   DB의 시즌 일정(관리자 페이지에서 변경)에 맞춰 시즌 정산·스플릿이 로컬 DB에 실제로 실행된다
  scheduler:
    logging: *default-logging
    profiles: ["scheduler"]
    build: ./scheduler
    container_name: bitground-scheduler
    env_file: ./scheduler/.env
    environment:
      RUN_HOURLY: "1"
      DB_HOST: mysql:3306
      BACKEND_URL: http://backend:8090 # 시즌·스플릿 완료 알림 (백엔드가 꺼져 있으면 알림만 실패)
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── monitoring 프로필: 로그(Loki)·지표(Prometheus)를 Grafana 한 곳에서 본다 ──────
  # Alloy가 컨테이너 로그는 Loki로, 백엔드 /actuator/prometheus 지표는 Prometheus로 보낸다.
  # (운영에서 모니터링을 다른 인스턴스로 나눠도 Alloy만 앱 서버에 두고 보내는 주소만 바꾸면 된다)
  loki:
    logging: *default-logging
    profiles: ["monitoring"]
    image: grafana/loki:3.7.1
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro # 90일 보관 (개인정보처리방침 접속 기록 3개월)
      - loki-data:/loki

  alloy:
    logging: *default-logging
    profiles: ["monitoring"]
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    command: run /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # 컨테이너 로그 수집
    depends_on:
      - loki
      - prometheus

  # 지표 저장소. 직접 수집하지 않고 Alloy가 보내는 값(remote write)을 받기만 한다
  prometheus:
    logging: *default-logging
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d # 지표는 추세 확인용이라 짧게
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    logging: *default-logging
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      # 로컬 시연용: 로그인 없이 조회
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus

volumes:
  mysql-data:
  redis-data:
  s3-data:
  loki-data:
  prometheus-data:
