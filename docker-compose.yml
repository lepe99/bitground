# 로컬 개발 환경
#   인프라만 (MySQL, Redis, S3Mock):     docker compose up -d
#   + 백엔드 컨테이너:                   docker compose --profile app up -d --build
#   + 모니터링 (Pinpoint APM, 로그 수집):
#       PINPOINT_ENABLED=true LOG_FORMAT=logstash docker compose --profile app --profile monitoring up -d --build
#       Pinpoint Web: http://localhost:8080   Grafana(Loki 로그): http://localhost:3000
services:
  mysql:
    image: mysql:8.0
    container_name: bitground-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: bitground
      MYSQL_USER: bitground
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bitground}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "3307:3306" # 호스트에 설치된 MySQL(3306)과 충돌하지 않도록 3307 사용
    volumes:
      - mysql-data:/var/lib/mysql
      # 테이블은 백엔드 기동 시 Flyway가 만든다 (backend/src/main/resources/db/migration)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bitground-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3 호환 로컬 스토리지 (이미지 업로드). 인증 없이 읽기 가능
  s3:
    image: adobe/s3mock:3.12.0
    container_name: bitground-s3
    environment:
      initialBuckets: bitground
      retainFilesOnExit: "true"
      root: /data
    ports:
      - "9090:9090"
    volumes:
      - s3-data:/data

  # ── app 프로필: 백엔드 컨테이너 ─────────────────────────────────────────
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: bitground-backend
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bitground?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: bitground
      DB_PASSWORD: ${MYSQL_PASSWORD:-bitground}
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://s3:9090
      STORAGE_PUBLIC_URL: http://localhost:9090/bitground # 브라우저에서 이미지를 읽는 주소
      REACT_HOST: http://localhost:5173
      # Pinpoint (monitoring 프로필과 함께 사용)
      PINPOINT_ENABLED: ${PINPOINT_ENABLED:-false}
      PINPOINT_COLLECTOR_HOST: pinpoint-collector
      PINPOINT_PROFILE: ${PINPOINT_PROFILE:-local}
      # logstash 로 두면 JSON 로그 출력 (Alloy → Loki 수집용), 비우면 텍스트
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── monitoring 프로필: Pinpoint 4.0.0 서버 ──────────────────────────────
  # 공식 pinpoint-docker 구성에서 트랜잭션 추적에 필요한 최소 구성만 사용
  # (Flink 실시간 통계, 알람 배치, Pinot 메트릭은 제외)
  zoo1:
    profiles: ["monitoring"]
    image: zookeeper:3.4.13
    container_name: pinpoint-zookeeper
    environment:
      ZOO_MY_ID: 1
    networks:
      default:
        # pinpoint-hbase 이미지는 zoo1~3 앙상블을 가정하므로 단일 노드에 별칭을 붙임
        aliases: [zoo2, zoo3]

  pinpoint-hbase:
    profiles: ["monitoring"]
    image: pinpointdocker/pinpoint-hbase:4.0.0
    container_name: pinpoint-hbase
    volumes:
      - pinpoint-hbase-data:/home/pinpoint/hbase
      - /home/pinpoint/zookeeper
    depends_on:
      - zoo1

  pinpoint-mysql:
    profiles: ["monitoring"]
    image: mysql:8.4 # Pinpoint 4.0은 MySQL 8.4 이상 필요
    container_name: pinpoint-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pinpoint
      MYSQL_DATABASE: pinpoint
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - pinpoint-mysql-data:/var/lib/mysql
      - ./monitoring/pinpoint/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  pinpoint-redis:
    profiles: ["monitoring"]
    image: redis:7-alpine
    container_name: pinpoint-redis

  pinpoint-collector:
    profiles: ["monitoring"]
    image: pinpointdocker/pinpoint-collector:4.0.0
    container_name: pinpoint-collector
    restart: unless-stopped # HBase 테이블 생성이 끝날 때까지 재시작하며 대기
    environment: &pinpoint-server-env
      SPRING_PROFILES_ACTIVE: release
      PINPOINT_ZOOKEEPER_ADDRESS: zoo1
      CLUSTER_ENABLE: "true"
      FLINK_CLUSTER_ENABLE: "false"
      SPRING_DATA_REDIS_HOST: pinpoint-redis
      SPRING_DATA_REDIS_PORT: "6379"
      JDBC_DRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      JDBC_URL: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
      JDBC_USERNAME: admin
      JDBC_PASSWORD: admin
      SPRING_DATASOURCE_HIKARI_JDBCURL: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
      SPRING_DATASOURCE_HIKARI_USERNAME: admin
      SPRING_DATASOURCE_HIKARI_PASSWORD: admin
      SPRING_METADATASOURCE_HIKARI_JDBCURL: jdbc:mysql://pinpoint-mysql:3306/pinpoint?characterEncoding=UTF-8
      SPRING_METADATASOURCE_HIKARI_USERNAME: admin
      SPRING_METADATASOURCE_HIKARI_PASSWORD: admin
      CONFIG_SENDUSAGE: "false"
    ports:
      # 호스트에서 직접 실행한 앱의 에이전트도 붙을 수 있도록 gRPC 포트 공개
      - "9991:9991"
      - "9992:9992"
      - "9993:9993"
    depends_on:
      pinpoint-hbase:
        condition: service_started
      pinpoint-mysql:
        condition: service_healthy
      pinpoint-redis:
        condition: service_started

  pinpoint-web:
    profiles: ["monitoring"]
    image: pinpointdocker/pinpoint-web:4.0.0
    container_name: pinpoint-web
    restart: unless-stopped # HBase 테이블 생성이 끝날 때까지 재시작하며 대기
    environment:
      <<: *pinpoint-server-env
      WEB_SERVER_PORT: "8080"
      CONFIG_SHOW_APPLICATIONSTAT: "true"
    ports:
      - "8080:8080"
    depends_on:
      pinpoint-hbase:
        condition: service_started
      pinpoint-mysql:
        condition: service_healthy
      pinpoint-redis:
        condition: service_started

  # ── monitoring 프로필: 로그 수집 (Alloy → Loki → Grafana) ────────────────
  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.7.1
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro # 90일 보관 (개인정보처리방침 접속 기록 3개월)
      - loki-data:/loki

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.21.3
    container_name: alloy
    command: run /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # 컨테이너 로그 수집
    depends_on:
      - loki

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.0
    container_name: grafana
    environment:
      # 로컬 시연용: 로그인 없이 조회
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

volumes:
  mysql-data:
  s3-data:
  pinpoint-hbase-data:
  pinpoint-mysql-data:
  loki-data:
